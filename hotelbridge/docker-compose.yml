# Local PostgreSQL for running HotelBridge against the production database driver.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hotelbridge
      POSTGRES_PASSWORD: hotelbridge
      POSTGRES_DB: hotelbridge
    ports: ["5432:5432"]
    volumes: [hotelbridge-pg:/var/lib/postgresql/data]
volumes:
  hotelbridge-pg: {}
